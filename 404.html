<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Operava Global Solutions | Google Maps</title>
  </head>
  <body>
    <p>Opening Operava on Google Maps…</p>
    <p>
      <a
        id="maps-link"
        href="https://www.google.com/maps?cid=13781392094140743681"
        target="_blank"
        rel="noopener noreferrer"
      >Open Operava on Google Maps</a>
    </p>
    <script>
      (function () {
        var WEB = "https://www.google.com/maps?cid=13781392094140743681";
        var INTENT =
          "intent://www.google.com/maps?cid=13781392094140743681#Intent;scheme=https;package=com.google.android.apps.maps;S.browser_fallback_url=" +
          encodeURIComponent(WEB) +
          ";end";
        var url = /Android/i.test(navigator.userAgent || "") ? INTENT : WEB;
        var opened = window.open(url, "_blank", "noopener,noreferrer");
        if (!opened) window.location.assign(WEB);
      })();
    </script>
  </body>
</html>
