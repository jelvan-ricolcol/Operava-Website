    <link
      rel="icon"
      type="image/svg+xml"
      href="https://res.cloudinary.com/sdaxzncs/image/upload/Favicon_32x32.svg"
    />

    <meta http-equiv="refresh" content="8;url=https://maps.app.goo.gl/JTZxoYr5SQxYpux68" />

    <style>
      :root {
        --bg: #f6f0ff;
        --surface: #ffffff;
        --ink: #1c1333;
        --muted: #5b5270;
        --brand: #6d28d9;
        --brand-dark: #4c1d95;
        --focus: #7c3aed;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        background:
          radial-gradient(1200px 600px at 80% -10%, #ede9fe 0%, transparent 55%),
          var(--bg);
        color: var(--ink);
        line-height: 1.5;
      }
      .skip {
        position: absolute;
        left: 0.75rem;
        top: -3rem;
        background: var(--brand);
        color: #fff;
        padding: 0.5rem 0.75rem;
        border-radius: 0.5rem;
        z-index: 10;
      }
      .skip:focus { top: 0.75rem; }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }
      .card {
        width: min(36rem, 100%);
        background: var(--surface);
        border: 1px solid #e9e1f7;
        border-radius: 1.25rem;
        padding: 2rem 1.75rem;
        box-shadow: 0 16px 40px rgba(76, 29, 149, 0.08);
      }
      h1 {
        font-size: 1.375rem;
        margin: 0 0 0.75rem;
        letter-spacing: -0.02em;
      }
      p { margin: 0 0 1.25rem; color: var(--muted); }
      .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; }
      a.button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        padding: 0.6rem 1.1rem;
        border-radius: 999px;
        background: var(--brand);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      a.button:hover { background: var(--brand-dark); }
      a.button:focus-visible,
      a.home:focus-visible,
      .skip:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 3px;
      }
      a.home {
        color: var(--brand-dark);
        font-weight: 600;
      }
      .status { font-size: 0.95rem; }
    </style>
  </head>
  <body>
    <a class="skip" href="#maps-link">Skip to Google Maps link</a>
    <main>
      <article class="card">
        <p class="status" role="status">Redirecting you to Operava on Google Maps…</p>
        <h1>Operava Global Solutions</h1>
        <p>
          This page takes visitors to the official Operava Google Maps listing.
          Query-string destinations are ignored.
        </p>
        <div class="actions">
          <a
            id="maps-link"
            class="button"
            href="https://maps.app.goo.gl/JTZxoYr5SQxYpux68"
          >Open Operava on Google Maps</a>
          <a class="home" href="https://www.operavaglobal.com/">Return to operavaglobal.com</a>
        </div>
      </article>
    </main>
    <script>
      (function () {
        var destination = "https://maps.app.goo.gl/JTZxoYr5SQxYpux68";
        var ua = navigator.userAgent || "";
        var crawler = /facebookexternalhit|Facebot|Twitterbot|LinkedInBot|WhatsApp|Slackbot|Pinterest|Discordbot|TelegramBot|Googlebot/i.test(ua);
        if (crawler) return;
        window.setTimeout(function () {
          window.location.replace(destination);
        }, 400);
      })();
    </script>
  </body>
</html>
